[project]
name = "agent-red-team"
version = "0.1.0"
description = "An adversarial test harness that measures both attack containment and task completion for tool-using agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "harness", "scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not manual and not docker'"
markers = [
    "manual: marks tests that require external API keys (deselected by default)",
    "docker: marks tests that require Docker to be installed and running",
]
